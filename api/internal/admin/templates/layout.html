{{define "head"}}<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · bykami admin</title>
<!--
  No robots. This is an operator console on a public hostname; it should never
  appear in an index, and the header is honoured by crawlers that ignore
  robots.txt on non-root paths.
-->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
/*
 * Tokens mirrored from packages/ui/src/tokens.css rather than imported: this is
 * served by Go, not built by Astro, and a shared file would mean a build step
 * for one stylesheet. Warm neutrals, ink-only accent, one hairline weight.
 *
 * Plus Jakarta Sans is not self-hosted here. The console is staff-facing on a
 * known device, and a webfont would be a network round trip and a CSP exception
 * bought for nothing.
 */
:root {
  --ground: #fafaf9;
  --surface: #ffffff;
  --line: rgba(10, 10, 10, 0.1);
  --text: rgba(10, 10, 10, 0.92);
  --muted: rgba(10, 10, 10, 0.6);
  --radius: 10px;
  --bad: #9f1239;
  --good: #14532d;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.55;
}
.wrap { width: 100%; max-width: 48rem; margin-inline: auto; padding: 1.5rem 1rem 4rem; }
.bar {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  border-bottom: 1px solid var(--line); background: var(--surface);
  padding: 0.75rem 1rem;
}
.bar .wrap { padding: 0; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.brand { font-weight: 700; letter-spacing: -0.4px; white-space: nowrap; }
/* Sized by height and nudged onto the text baseline, so "admin" reads as part
   of the same line rather than as a caption under the logo. */
.brand img { height: 22px; width: auto; vertical-align: -5px; margin-right: 0.15em; }
h1 { font-size: 28px; line-height: 34px; letter-spacing: -0.7px; margin: 0 0 1.5rem; }
h2 { font-size: 20px; line-height: 28px; letter-spacing: -0.4px; margin: 2rem 0 0.75rem; }
p { margin: 0 0 1rem; max-width: 68ch; }
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 1.5rem;
}
label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 0.25rem; }
input, select, textarea {
  width: 100%; font: inherit; color: inherit; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 0.625rem 0.75rem; min-height: 44px;
}
button {
  font: inherit; font-weight: 600; min-height: 44px; width: 100%;
  padding: 0.625rem 1rem; border-radius: var(--radius);
  border: 1px solid var(--text); background: var(--text); color: var(--surface);
  cursor: pointer;
}
button.secondary { background: transparent; color: var(--text); }
button[disabled] { opacity: 0.45; cursor: not-allowed; }
.field { margin-bottom: 1rem; }
.row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
.row > * { flex: 1 1 8rem; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tabular { font-variant-numeric: tabular-nums; }
.notice, .error, .warn {
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 0.75rem 1rem; margin-bottom: 1.5rem; font-size: 14px;
}
.notice { border-color: var(--good); color: var(--good); }
.error { border-color: var(--bad); color: var(--bad); }
.balance { font-size: 40px; font-weight: 700; letter-spacing: -1px; margin: 0; }
/* Wide content scrolls in its own box; the page never scrolls sideways. */
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 0.5rem 0.75rem 0.5rem 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 600; color: var(--muted); }
td.reason { white-space: normal; min-width: 14rem; }
form.inline { display: inline; }
form.inline button { width: auto; min-height: 0; padding: 0.25rem 0.75rem; font-size: 14px; }
nav a { color: inherit; text-decoration: none; font-size: 14px; font-weight: 600; padding: 0 0.5rem; }
nav a[aria-current] { text-decoration: underline; text-underline-offset: 4px; }
/* The booking day's own pager, which is a row of links in the page rather than
   the header's nav — so it gets spacing the header does not need. */
nav.days { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
nav.days a { padding: 0; text-decoration: underline; text-underline-offset: 3px; }

/* Frame catalogue */
.frames { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
.frame { padding: 1rem; }
.frame-name { font-weight: 600; margin: 0.75rem 0 0.125rem; }
/*
 * The preview is checkered so that a transparent hole reads as a hole rather
 * than as white artwork — which is exactly the mistake the operator is here to
 * catch, since a white-filled "hole" prints as a white box over the photo.
 */
.preview {
  position: relative; width: 100%; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--line);
  background-color: #fff;
  background-image:
    linear-gradient(45deg, #e7e5e4 25%, transparent 25%, transparent 75%, #e7e5e4 75%),
    linear-gradient(45deg, #e7e5e4 25%, transparent 25%, transparent 75%, #e7e5e4 75%);
  background-size: 16px 16px;
  background-position: 0 0, 8px 8px;
}
.preview img { display: block; width: 100%; height: auto; }
/* Drawn from the cells the booth composes with, so what is checked here is what
   the printer does. */
.slot {
  position: absolute; display: flex; align-items: center; justify-content: center;
  outline: 2px dashed rgba(159, 18, 57, 0.75); outline-offset: -2px;
  color: var(--bad); font-size: 13px; font-weight: 700;
}
.state { font-size: 13px; font-weight: 600; margin: 0 0 0.5rem; }
.state.on { color: var(--good); }
.state.off { color: var(--muted); }
button.danger { background: var(--bad); border-color: var(--bad); }
/*
 * Calendar settings. The shared rule above sets every input and button to
 * width:100%, which is right for a stacked form and wrong inside a table cell —
 * the field ate the row and pushed "Simpan" off the edge, where .scroll-x
 * faithfully let it scroll away. So the pair is laid out as a row here, with the
 * field allowed to shrink.
 */
.cal-form { display: flex; gap: 0.5rem; align-items: center; }
.cal-form input { flex: 1 1 22rem; min-width: 12rem; }
.cal-form button { width: auto; flex: 0 0 auto; padding-inline: 1rem; }
details { margin-top: 0.75rem; }
summary { cursor: pointer; color: var(--muted); }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <span class="brand"><img src="/logo.png" alt="studio by KAMI" width="640" height="210"> · admin</span>
    {{if .Operator}}
      <nav>
        <a href="/customers">Pelanggan</a>
        <a href="/bookings">Booking</a>
        <a href="/frames">Frame</a>
        <a href="/settings">Pengaturan</a>
      </nav>
      <span class="small muted tabular">{{.Operator}}
        <form class="inline" method="post" action="/logout">
          <button class="secondary" type="submit">Keluar</button>
        </form>
      </span>
    {{end}}
  </div>
</header>
<main class="wrap">
{{end}}

{{define "foot"}}
</main>
</body>
</html>
{{end}}

{{define "messages"}}
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
{{if .Notice}}<p class="notice">{{.Notice}}</p>{{end}}
{{end}}
