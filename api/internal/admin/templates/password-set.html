{{define "password-set.html"}}
{{template "head" .}}

<h1>Ubah kata sandi</h1>

<p class="muted">
  Kata sandi saat ini harus diubah sebelum melanjutkan.
</p>

<div class="card">
  {{template "messages" .}}

  <form method="post" action="/password/set">
    <div class="field">
      <label for="password">Kata sandi baru</label>
      <input id="password" name="password" type="password" required minlength="12">
    </div>
    <div class="field">
      <label for="password2">Ulangi kata sandi baru</label>
      <input id="password2" name="password2" type="password" required minlength="12">
    </div>
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <button type="submit">Simpan</button>
  </form>

  <p class="small muted" style="margin-top:1rem">
    Minimal 12 karakter. Tidak perlu simbol — panjang yang melindungi.
  </p>
</div>

{{template "foot" .}}
{{end}}
