name: Tencent preflight

# Answers one question: can Actions authenticate to Tencent Cloud, and is
# ap-jakarta usable by this account? Worth its own workflow because the answer
# is needed before the VPS is provisioned, not discovered halfway through a
# `terraform apply` that has already created half a network.
on:
  workflow_dispatch:
  push:
    paths:
      - "infra/tencent/**"
      - ".github/workflows/tencent-preflight.yml"
  pull_request:
    paths:
      - "infra/tencent/**"
      - ".github/workflows/tencent-preflight.yml"

concurrency:
  group: tencent-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6

      # Offline and credential-free, so it runs on every trigger including fork
      # pull requests. A green here means a red below is genuinely the account.
      - name: Signature self-test
        run: ./infra/tencent/preflight.sh --self-test

      # Skipped rather than failed when the secrets are absent: a fork PR has no
      # access to them, and a red X there would say nothing about the account.
      # A manual dispatch is an explicit request for the answer, so it runs
      # regardless and fails loudly if the credentials are missing.
      - name: API connection
        if: github.event_name == 'workflow_dispatch' || env.TENCENTCLOUD_SECRET_ID != ''
        run: ./infra/tencent/preflight.sh

      - name: Note when credentials are absent
        if: github.event_name != 'workflow_dispatch' && env.TENCENTCLOUD_SECRET_ID == ''
        run: |
          echo "::notice::Signing verified. TENCENTCLOUD_SECRET_ID is not set, so the live API check was skipped — add the repository secrets and re-run this workflow to test the connection."
