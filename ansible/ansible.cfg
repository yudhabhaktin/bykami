[defaults]
inventory = inventory.yml
roles_path = roles
# Readable multi-line output. Not `stdout_callback = yaml` — that was
# community.general's callback, removed in that collection's 12.0.0.
result_format = yaml

# The box has Python 3.12 at /usr/bin/python3. auto_silent picks it without
# emitting a deprecation warning on every single task.
interpreter_python = auto_silent

# Facts are gathered per play and this is a one-host inventory, so caching buys
# nothing and a stale cache after a re-image costs a confusing afternoon.
gathering = smart

[ssh_connection]
# One SSH connection per host instead of one per task. On a link to Singapore
# this is the difference between a playbook that takes a minute and one that
# takes ten.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
