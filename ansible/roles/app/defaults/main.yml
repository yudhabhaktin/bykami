---
app_name: bykami

# Path on the CONTROL machine to a linux/amd64 binary. There is deliberately no
# default: the design rule is "never build on the VPS", so this role copies a
# binary someone else built — CI, or a local cross-compile:
#
#   cd api && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
#     go build -trimpath -ldflags="-s -w" -o /tmp/bykami ./cmd/bykami
app_binary_src: ""

app_user: bykami
app_install_path: /usr/local/bin/bykami
app_data_dir: /var/lib/bykami

# localhost, and this is the security boundary rather than a preference. The
# tunnel dials out to reach it; binding 0.0.0.0 would expose the app on the
# public IP and make the security group load-bearing again.
app_listen_addr: 127.0.0.1:8080

# ~1.4 GiB per the memory budget. Sized against the OS and cloudflared's ~210 MB
# rather than against the box total: a limit set at capacity is not a limit,
# because the OOM killer arrives before the GC does.
app_gomemlimit: 1400MiB

app_backup_dir: /var/backups/bykami
app_backup_keep: 7
app_backup_oncalendar: "*-*-* 03:30:00"

# Off-box copies. Local backups survive rm and a bad migration; they do not
# survive losing the instance, and this instance has an auto-release scheduled
# for 2026-10-24 — a scheduled event, not a hypothetical.
#
# Off by default because it needs credentials. Enable with a vars file:
#   app_r2_enabled: true
#   app_r2_access_key_id: "..."
#   app_r2_secret_access_key: "..."
app_r2_enabled: false
app_r2_bucket: bykami-backups
app_r2_endpoint: ""
app_r2_access_key_id: ""
app_r2_secret_access_key: ""

# 30 daily copies. At the current ~72 KB per backup that is ~2 MB; the count
# matters only once the database has real customers in it.
app_r2_keep: 30

# Hard ceiling, checked against the bucket's actual contents before every
# upload. The free tier is 10 GB; this is a fifth of it, so overrunning takes a
# sustained mistake rather than one bad day.
#
# The guard exists because retention-by-count alone is not a bound: 30 copies of
# a database that has grown to 500 MB is 15 GB, and the first sign would be a
# bill. When the cap is hit the script deletes oldest-first to fit, and refuses
# rather than silently exceeding it.
app_r2_budget_bytes: 2147483648

# Pull-based deploy. CI publishes a release tagged api-<sha>; the box polls for
# it. Inverted on purpose: the VPS has one inbound rule and GitHub's runner
# ranges are too broad to allowlist without undoing the point of the tunnel.
app_release_repo: bhaktiyudha/bykami

# Every 10 minutes, offset from the hour. The cost of a poll is one API call
# against an unauthenticated rate limit of 60/hour per IP — 6/hour leaves room
# for a manual `systemctl start bykami-update` without tripping it.
app_update_oncalendar: "*:03/10"

# Off by default. A box that installs whatever main published, unattended, is a
# supply-chain path from a merged commit straight to production — so turning it
# on is a deliberate act, per host, not a side effect of running the role.
app_update_enabled: false
