---
# Two ways a binary arrives, and the role supports both because they serve
# different moments. Pushing one (app_binary_src) is how a workstation deploys
# and how the box is bootstrapped before any release exists. Pulling is the
# steady state. Neither is required if a binary is already installed.

- name: Check for an already-installed binary
  ansible.builtin.stat:
    path: "{{ app_install_path }}"
  register: app_installed_stat

- name: Check the pushed binary exists on the control machine
  ansible.builtin.stat:
    path: "{{ app_binary_src }}"
  register: app_binary_stat
  delegate_to: localhost
  become: false
  when: app_binary_src | length > 0

- name: Require a binary from somewhere
  ansible.builtin.assert:
    that:
      - app_binary_src | length > 0 or app_installed_stat.stat.exists or app_update_enabled
    fail_msg: >-
      No binary to run. Either build one with ./scripts/build-linux.sh and
      point app_binary_src at dist/bykami-linux, or set
      app_update_enabled=true to let the box pull the latest release itself.
      This role never builds on the host.
    quiet: true

- name: Require the pushed binary to be present
  ansible.builtin.assert:
    that:
      - app_binary_stat.stat.exists
    fail_msg: "No file at {{ app_binary_src }} on the control machine."
    quiet: true
  when: app_binary_src | length > 0

- name: Install sqlite3
  # For backups only. The app embeds a pure-Go SQLite driver and needs no
  # system library; this is the CLI, and it is what makes a consistent hot
  # backup possible at all.
  ansible.builtin.apt:
    name: sqlite3
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the service user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create the data directory
  ansible.builtin.file:
    path: "{{ app_data_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    # 0750, not 0755. This directory holds the customer database.
    mode: "0750"

- name: Create the backup directory
  ansible.builtin.file:
    path: "{{ app_backup_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0750"

- name: Install the binary
  # copy compares checksums, so this is idempotent and only restarts the
  # service when the binary actually changed. That is what makes a redeploy of
  # an unchanged SHA a no-op rather than a needless drop of in-flight requests.
  #
  # Skipped entirely when nothing was pushed, which is the normal case once the
  # updater is running — otherwise every playbook run would fight the pulled
  # version and reinstall whatever the operator last had lying in /tmp.
  ansible.builtin.copy:
    src: "{{ app_binary_src }}"
    dest: "{{ app_install_path }}"
    owner: root
    group: root
    # Owned by root and not writable by the service user: a compromised app
    # process should not be able to rewrite the binary it will be restarted as.
    mode: "0755"
  when: app_binary_src | length > 0
  notify: Restart app

- name: Require R2 credentials when off-box backups are enabled
  ansible.builtin.assert:
    that:
      - app_r2_endpoint | length > 0
      - app_r2_access_key_id | length > 0
      - app_r2_secret_access_key | length > 0
    fail_msg: >-
      app_r2_enabled is true but the R2 credentials are empty. Pass them from a
      vars file rather than on the command line, where they would be visible in
      ps to every local user.
    quiet: true
  when: app_r2_enabled

- name: Install rclone
  ansible.builtin.apt:
    name: rclone
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: app_r2_enabled

- name: Create the rclone config directory
  ansible.builtin.file:
    path: /etc/rclone
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: app_r2_enabled

- name: Write the rclone config
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: /etc/rclone/r2.conf
    owner: root
    group: "{{ app_user }}"
    # Readable by the backup job and root, nobody else. These are write
    # credentials for the only copy of the database that survives losing the
    # instance.
    mode: "0640"
  # The rendered file contains the secret key; without this the whole thing is
  # printed to the play output on any change, and from there into a CI log.
  no_log: true
  when: app_r2_enabled

- name: Install the backup script
  ansible.builtin.template:
    src: bykami-backup.sh.j2
    dest: "/usr/local/bin/{{ app_name }}-backup"
    owner: root
    group: root
    mode: "0755"

- name: Install the update script
  ansible.builtin.template:
    src: bykami-update.sh.j2
    dest: "/usr/local/bin/{{ app_name }}-update"
    owner: root
    group: root
    # Not writable by the service user: this script runs as root and installs
    # the binary, so the app being able to edit it would be a direct path from
    # a compromised process to persistent root.
    mode: "0755"

- name: Write the environment file
  # Credentials only. Everything else the app needs is a flag; these are here
  # because argv is readable by every local user through ps.
  #
  # BYKAMI_INSTAGRAM_ACCOUNT is not a credential and is here anyway, to keep the
  # mirror's configuration in one place rather than splitting a two-line feature
  # across a unit file and an environment file.
  ansible.builtin.copy:
    content: |
      BYKAMI_BOOTH_TOKEN={{ app_booth_token }}
      BYKAMI_INSTAGRAM_TOKEN={{ app_instagram_token }}
      BYKAMI_INSTAGRAM_ACCOUNT={{ app_instagram_account }}
      BYKAMI_GOOGLE_CREDENTIALS={{ app_google_credentials }}
    dest: /etc/bykami.env
    owner: root
    group: root
    # 0600. The unit file is 0644 and world-readable; this is why the token is
    # not in it.
    mode: "0600"
  no_log: true
  notify: Restart app

- name: Install the systemd units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: bykami.service.j2, dest: "{{ app_name }}.service" }
    - { src: bykami-backup.service.j2, dest: "{{ app_name }}-backup.service" }
    - { src: bykami-backup.timer.j2, dest: "{{ app_name }}-backup.timer" }
    - { src: bykami-update.service.j2, dest: "{{ app_name }}-update.service" }
    - { src: bykami-update.timer.j2, dest: "{{ app_name }}-update.timer" }
  notify: Restart app

- name: Bootstrap the binary by pulling the latest release
  # Only when the box has no binary and none was pushed. The updater installs,
  # restarts and health-gates on its own, so the tasks below then find a
  # running service rather than a unit that cannot start.
  ansible.builtin.command:
    cmd: "/usr/local/bin/{{ app_name }}-update"
  register: app_bootstrap
  changed_when: "'installed' in app_bootstrap.stdout"
  when:
    - app_binary_src | length == 0
    - not app_installed_stat.stat.exists
    - app_update_enabled

- name: Enable and start the app
  ansible.builtin.systemd_service:
    name: "{{ app_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Enable the backup timer
  ansible.builtin.systemd_service:
    name: "{{ app_name }}-backup.timer"
    enabled: true
    state: started
    daemon_reload: true

- name: Set the update timer to match app_update_enabled
  # Both branches are declared rather than only the enabling one, so flipping
  # the variable back off actually stops the timer. A task that only ever
  # enables leaves the box running whatever it was last told to run.
  ansible.builtin.systemd_service:
    name: "{{ app_name }}-update.timer"
    enabled: "{{ app_update_enabled }}"
    state: "{{ 'started' if app_update_enabled else 'stopped' }}"
    daemon_reload: true

- name: Flush handlers so the health check tests the new binary
  # Without this, handlers run at the end of the play and the check below would
  # be testing whatever was already running — reporting a deploy healthy on the
  # strength of the previous version.
  ansible.builtin.meta: flush_handlers

- name: Wait for the app to report ready
  # The check that actually means something. systemd reporting active only says
  # the process started; /healthz touches the database, so a 200 proves the app
  # can reach its own storage. Run on the host against localhost because the
  # app is not reachable from anywhere else by design.
  ansible.builtin.uri:
    url: "http://{{ app_listen_addr }}/healthz"
    status_code: 200
  register: app_health
  retries: 10
  delay: 2
  until: app_health is succeeded
  changed_when: false

# Booking needs a catalogue before it can sell anything, and until now that was a
# shell step somebody had to remember after every fresh install: a deploy would
# finish healthy, and studio.bykami.id/booking would show "no packages" because
# the tables were empty. The seed is idempotent — every insert is
# ON CONFLICT DO NOTHING — so the risk is not running it twice, it is never
# running it at all.
#
# After the health check on purpose. The binary applies its own migrations at
# startup, so `booking_services` does not exist until the new binary has run, and
# a check before that point would fail on a box being upgraded from a version
# that predates booking.

- name: Count the booking catalogue
  # As the service user, not root — see the seed task below for why that matters.
  # sqlite3 rather than `bykami booking services`, because a count is unambiguous
  # and parsing a table for emptiness is not.
  become_user: "{{ app_user }}"
  ansible.builtin.command:
    argv:
      - sqlite3
      - "{{ app_data_dir }}/{{ app_name }}.db"
      - "SELECT COUNT(*) FROM booking_services"
  register: app_booking_count
  changed_when: false
  # Tolerated rather than fatal. A box still running a binary that predates
  # booking has no booking_services table, and sqlite3 exits non-zero with "no
  # such table" — a true statement about a half-upgraded box, not a reason to fail
  # a deploy that has otherwise succeeded. The seed is skipped and the message
  # below says why, instead of ending the play on an error whose wording sends
  # somebody looking at SQL.
  failed_when: false

- name: Seed the booking catalogue
  # Only when it is empty. The command would be harmless run every time, but it
  # prints the same "seeded 3 resources, 17 services" either way, so a task that
  # ran unconditionally would report a change on every deploy and train whoever
  # reads the output to ignore it.
  #
  # become_user is load bearing. SQLite writes -wal and -shm files beside the
  # database, owned by whoever opened it. Seeding as root leaves those two files
  # owned by root in a directory the service can write, and the service — running
  # as {{ app_user }} — then fails on its next write. The symptom is a booking
  # page that loads, lists packages, and cannot take a booking.
  when:
    - app_booking_seed | bool
    - app_booking_count.rc == 0
    - app_booking_count.stdout | trim | int == 0
  become_user: "{{ app_user }}"
  ansible.builtin.command:
    argv:
      - "{{ app_install_path }}"
      - -db
      - "{{ app_data_dir }}/{{ app_name }}.db"
      - booking
      - seed
  register: app_booking_seeded

- name: Report what the booking catalogue holds
  # Printed rather than assumed. A deploy that seeded nothing because the tables
  # were already full and one that seeded nothing because the flag is off look
  # identical in the output above.
  ansible.builtin.debug:
    msg: >-
      {{
        'Booking tables are missing — the running binary predates booking. Ship a newer one and re-run.'
        if app_booking_count.rc != 0 else
        'Booking catalogue: ' ~ (app_booking_seeded.stdout | default('already present', true) | trim)
          ~ ' (' ~ (app_booking_count.stdout | trim) ~ ' packages before this run).'
      }}
      {{ 'Google Calendar sync is off — set app_google_credentials to enable it.'
         if not app_google_credentials else
         'Google Calendar key present; connect each room on the console Pengaturan page.' }}
