---
# Everything here is conditional on booth_enabled. The role is listed in
# site.yml unconditionally so that flipping the flag off actually removes the
# service, rather than leaving whatever was last deployed running forever.

- name: Stop and disable the booth agent when it is not wanted
  ansible.builtin.systemd_service:
    name: "{{ booth_name }}"
    enabled: false
    state: stopped
  failed_when: false
  when: not booth_enabled

- name: Report that the booth agent is not deployed
  ansible.builtin.debug:
    msg: >-
      booth_enabled is false, so no booth agent is running here. This is the
      correct state for a box that only serves the operator console.
  when: not booth_enabled

- name: Deploy the booth agent
  when: booth_enabled
  block:
    - name: Require an access token
      # The agent refuses to start without one, so this only moves the failure
      # earlier and names it. Every route it serves is unauthenticated by
      # design — correct for a screen wired to the PC beside it, indefensible
      # on a public hostname where /api/capture takes 16 MB uploads.
      ansible.builtin.assert:
        that:
          - booth_access_token | length >= 24
        fail_msg: >-
          booth_access_token is empty or too short. Generate one with
          `openssl rand -hex 24` — or several, comma-separated, for one per
          tester — and pass it from a vars file, not on the command line where
          ps would show it to every local user.
        quiet: true

    - name: Check the pushed binary exists on the control machine
      ansible.builtin.stat:
        path: "{{ booth_binary_src }}"
      register: booth_binary_stat
      delegate_to: localhost
      become: false
      when: booth_binary_src | length > 0

    - name: Check whether the box already has a binary
      ansible.builtin.stat:
        path: "{{ booth_install_path }}"
      register: booth_installed_stat

    - name: Require a binary from somewhere
      ansible.builtin.assert:
        that:
          - booth_binary_src | length > 0 or booth_installed_stat.stat.exists or booth_update_enabled
        fail_msg: >-
          No binary to run. Either build one with ./scripts/build-linux.sh and
          point booth_binary_src at dist/bykami-agent-linux — it builds the
          kiosk bundle first, and skipping that embeds an empty UI in a binary
          that compiles perfectly well — or set booth_update_enabled=true and
          let the box pull agent-* releases itself. This role never builds on
          the host.
        quiet: true

    - name: Require the pushed binary to be present
      ansible.builtin.assert:
        that:
          - booth_binary_stat.stat.exists
        fail_msg: "No file at {{ booth_binary_src }} on the control machine."
        quiet: true
      when: booth_binary_src | length > 0

    - name: Create the service user
      ansible.builtin.user:
        name: "{{ booth_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        state: present

    - name: Create the data directory
      ansible.builtin.file:
        path: "{{ booth_data_dir }}"
        state: directory
        owner: "{{ booth_user }}"
        group: "{{ booth_user }}"
        # 0750. Holds captured frames — faces, on a public-facing box.
        mode: "0750"

    - name: Install the binary
      # Skipped entirely when nothing was pushed, which is the normal case once
      # the updater is running — otherwise every play run would fight the
      # pulled version and reinstall whatever the operator last built locally,
      # which is a deploy that silently goes backwards.
      ansible.builtin.copy:
        src: "{{ booth_binary_src }}"
        dest: "{{ booth_install_path }}"
        owner: root
        group: root
        mode: "0755"
      when: booth_binary_src | length > 0
      notify: Restart booth agent

    - name: Write the environment file
      ansible.builtin.copy:
        content: |
          BYKAMI_ACCESS_TOKEN={{ booth_access_token }}
          BYKAMI_BOOTH_TOKEN={{ booth_token }}
        dest: /etc/bykami-agent.env
        owner: root
        group: root
        # 0600. The unit file is 0644 and world-readable; this is why the token
        # is not in it.
        mode: "0600"
      no_log: true
      notify: Restart booth agent

    - name: Install the systemd unit
      ansible.builtin.template:
        src: bykami-agent.service.j2
        dest: "/etc/systemd/system/{{ booth_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify: Restart booth agent

    - name: Install the update script
      ansible.builtin.template:
        src: bykami-agent-update.sh.j2
        dest: "/usr/local/bin/{{ booth_name }}-update"
        owner: root
        group: root
        # Not writable by the service user. A compromised agent process should
        # not be able to rewrite the script that runs as root and installs its
        # next binary.
        mode: "0755"

    - name: Install the update units
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "/etc/systemd/system/{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - { src: bykami-agent-update.service.j2, dest: "{{ booth_name }}-update.service" }
        - { src: bykami-agent-update.timer.j2, dest: "{{ booth_name }}-update.timer" }

    - name: Pull a binary now if the box has none
      # Only when the box has nothing installed and nothing was pushed. Without
      # this the play would start a unit whose ExecStart does not exist and then
      # wait for a health check that can never pass — the first timer tick is up
      # to ten minutes away, so the deploy would look broken rather than
      # pending.
      ansible.builtin.command:
        cmd: "/usr/local/bin/{{ booth_name }}-update"
      when:
        - booth_update_enabled
        - not booth_installed_stat.stat.exists
        - booth_binary_src | length == 0
      changed_when: true

    - name: Set the update timer to match booth_update_enabled
      # Both states, not just the enabled one: turning the flag off has to stop
      # the timer, or a box keeps pulling releases after someone decided it
      # should not.
      ansible.builtin.systemd_service:
        name: "{{ booth_name }}-update.timer"
        enabled: "{{ booth_update_enabled }}"
        state: "{{ 'started' if booth_update_enabled else 'stopped' }}"
        daemon_reload: true

    - name: Enable and start the booth agent
      ansible.builtin.systemd_service:
        name: "{{ booth_name }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Flush handlers so the checks below test the new binary
      ansible.builtin.meta: flush_handlers

    - name: Wait for the booth agent to answer
      # Against localhost with a localhost Host header, which is the path that
      # needs no token. A 200 here proves the process is up and its database
      # opened; it says nothing about the tunnel.
      ansible.builtin.uri:
        url: "http://{{ booth_listen_addr }}/api/state"
        status_code: 200
      register: booth_health
      retries: 10
      delay: 2
      until: booth_health is succeeded
      changed_when: false

    - name: Load printer media if the roll is empty
      # Without this the print step refuses and a test run stops three screens
      # early. Conditional so that re-running the play does not keep adding
      # sheets to a roll that already has some — the ledger is append-only and
      # every load is a permanent entry.
      ansible.builtin.command:
        cmd: >-
          {{ booth_install_path }} -root {{ booth_data_dir }}
          media load {{ booth_media_sheets }} "test deployment"
      become: true
      become_user: "{{ booth_user }}"
      # The uri task above does not execute under --check, so booth_health has
      # no .json there and a bare reference aborts the whole play — which made
      # --check unusable for this role rather than merely incomplete. Defaulting
      # to a non-zero count skips the load, which is the right answer in check
      # mode: nothing has been deployed to have an empty roll.
      when: (booth_health.json | default({})).get('media', {}).get('sheets_remaining', 1) | int == 0
      changed_when: true

    - name: Report where the test booth is
      ansible.builtin.debug:
        msg: >-
          Booth agent up. Open https://{{ booth_public_host }}/?t=<token> —
          the token is in /etc/bykami-agent.env on this host. Payments are
          simulated and nothing here takes money: press "Simulasikan
          pembayaran" on the QR screen to release the shutter.
