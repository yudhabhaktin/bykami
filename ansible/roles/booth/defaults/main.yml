---
# The booth agent, deployed to the VPS for testing only.
#
# This is not where the agent belongs. It is a booth binary: it owns a printer,
# a hot folder and a camera on a PC in a shop, and on this box it has none of
# those. What it does have here is a real HTTPS origin, which is the one thing a
# laptop cannot give it — getUserMedia refuses to run on an insecure origin, so
# without this the capture flow cannot be tried on a phone or a tablet at all.
#
# Everything below is therefore sized for a test surface that gets deleted, not
# for an outlet.

# Off, and the role is a no-op until this is true. A booth agent quietly running
# on the operator console's box is a surprise nobody needs to find later.
booth_enabled: false

booth_name: bykami-agent

# Path on the CONTROL machine to a linux/amd64 binary. Same rule as the app
# role: never build on the VPS.
#
#   ./scripts/build-linux.sh
#
# It builds the kiosk bundle first — skip that and the binary embeds an empty
# UI — and leaves dist/bykami-agent-linux, which is what a vars file should
# point this at. A temp directory also works, right up until it is emptied and
# the play stops on a missing binary having done nothing.
#
# Leave it empty when booth_update_enabled is true and let the box pull its own
# releases. Setting both means every play run reinstalls whatever is on the
# control machine over whatever the timer pulled, which is a deploy that
# silently goes backwards.
booth_binary_src: ""

# Pull-based deploy: the box installs agent-* releases itself, on a timer.
#
# Off by default, and the README used to say this role would never have it —
# "a temporary surface should not acquire a supply chain". That argument was
# about not building a delivery mechanism nobody had asked for. Deploying by
# hand turned out to mean deploying rarely, from a laptop, with the binary path
# and the SSH firewall hole both going stale between runs; the supply chain was
# a laptop either way, and a worse one.
#
# What the flag does not change: CI still reaches into nothing. The box pulls,
# so there is no inbound rule to open and no deploy credential in GitHub. That
# was the actual security property, and it survives.
booth_update_enabled: false
booth_release_repo: bhaktiyudha/bykami

# Every ten minutes at :08. The API's poller is at :03 — offset rather than
# shared, so the two do not restart services in the same minute on a 2 GiB box.
booth_update_oncalendar: "*:08/10"

# How long to wait for a customer to finish before restarting anyway.
#
# Nothing sweeps abandoned sessions: somebody who opens the QR screen and walks
# off leaves a row in awaiting_payment forever. Without a bound the updater
# would defer every release from that moment on and report success while doing
# it. Two hours is longer than any real session — the take limit and the
# five-minute clock cap a genuine one far below this — so in practice the
# deadline is only ever reached by a session nobody is standing in front of.
booth_update_max_defer_minutes: 120

booth_user: bykami-agent
booth_install_path: /usr/local/bin/bykami-agent
booth_data_dir: /var/lib/bykami-agent

# localhost. The tunnel dials out to reach it; the public hostname below is
# routed there by Cloudflare, not by binding a public interface.
booth_listen_addr: 127.0.0.1:8899

# The hostname the agent will additionally answer to. Must match the ingress
# rule in infra/cloudflare/tunnel.tf, and must be non-empty for the token to be
# demanded at all.
booth_public_host: booth-test.bykami.id

# The secret admitting requests to booth_public_host. No default: the agent
# refuses to start with a public host and an empty token, so a forgotten value
# fails loudly at deploy time rather than silently publishing an open
# photo-upload endpoint.
#
# Comma-separated for one token per tester — "<tester-1>,<tester-2>". Withdrawing
# somebody is then deleting their token and re-running this play, which leaves
# everyone else's link working. With one shared secret that operation costs
# everybody their access, which is why it never happens.
#
# Pass it from a vars file, never on the command line:
#   ansible-playbook site.yml --tags booth -e @booth.vars.yml
booth_access_token: ""

# Where the frame catalogue lives. Empty disables syncing, and the booth then
# offers only the designs compiled into the binary.
#
# On this box it points at the operator console on the same host, which is what
# makes the whole loop testable: upload a frame at app.bykami.id, publish it,
# and it appears on booth-test.bykami.id a few minutes later.
booth_frame_sync: "https://app.bykami.id"
booth_frame_sync_every: 5m

# The booth's credential for that catalogue, and it must match app_booth_token
# in the app role — they are two halves of one shared secret. Empty on both
# sides means the sync surface answers 503 and the booth never polls, which is
# a working configuration rather than a broken one.
#
# Pass it from the same vars file as the access token, never on the command
# line:
#   ansible-playbook site.yml --tags booth -e @booth.vars.yml
booth_token: ""

# Simulated, both of them, and neither can become real by accident. There is no
# printer on this box and no payment provider anywhere yet.
#
# sim-auto-settle was 1s, which removed the payment step entirely: the charge
# settled before the QR had finished rendering and the booth walked itself into
# frame selection. Convenient for rehearsing the camera, and indistinguishable
# from a broken payment gate for anyone testing the actual flow — it was
# reported as a bug, which is the clearest evidence the shortcut cost more than
# it saved.
#
# Zero means the charge waits. The kiosk shows a "Simulasikan pembayaran"
# button while the simulated provider is selected, so settling is one deliberate
# tap and the shutter is locked until it happens, exactly as it will be with a
# real provider.
booth_auto_settle: 0
booth_print_speed: 1000

# Frames come from the tester's own browser. There is no camera here.
booth_source: webcam

# Shorter than the booth's seven days. These are test frames, but they are still
# faces on a public-facing box.
booth_retention: 24h

# Sheets to load so the print step can be exercised. Printing refuses with an
# empty roll, which would stop a test run three screens early.
booth_media_sheets: 700

# ~350 MB. The agent decodes and rescales full frames; on a 2 GiB box shared
# with the operator API this is the limit that keeps the GC working before the
# OOM killer reaches the other process.
booth_gomemlimit: 350MiB
