<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <!--
      No user scaling. This is a fixed-size touchscreen in a booth, and a
      customer who pinch-zooms the countdown by accident has no way back.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>bykami booth</title>
    <!--
      public/ holds its own copy of the mark rather than importing it from
      @bykami/ui, for the same reason styles.css restates the design tokens:
      this bundle is embedded in the Go agent and must build without the Astro
      workspace. The source is packages/ui/src/brand/icon.svg.
    -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="bykami" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
