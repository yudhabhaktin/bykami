<!--
  The by KAMI app icon. One mark for every surface: the four sites, the booth
  screen, the operator console and the customer's download page.

  The camera mark from the "studio by KAMI" lockup, on its own. The lockup is
  three units wide and its wordmark stops being readable somewhere around
  200px, so a home screen tile or a 16px tab would be showing a grey smear
  where the name should be. The mark carries the brand at every size the
  wordmark cannot; the two appear together only where there is room for the
  full lockup.

  Geometry, not a trace. The master is a 4884px raster, and the mark inside it
  is entirely axis-aligned, so the shapes below are the artwork's own
  rectangles measured off the alpha channel and scaled onto a 100-unit grid
  rather than a curve fit of its edges. That keeps the file small and the edges
  on the pixel grid at every size. Measured coverage against the master is
  98.3%, the shortfall being the antialiasing on corners this squares off.

  Three things are deliberate and will read as defects:
  - the bottom rail is open in the middle, leaving two feet;
  - the shutter nub floats clear of the top rail rather than joining it;
  - horizontal strokes are about twice the weight of the verticals.
  All three are in the master artwork. Closing the rail, welding the nub down
  or evening the strokes would be redrawing the logo, not tidying the file.

  Ink on cream, no accent colour, because tokens.css reserves colour for the
  photographs. Dark tile rather than light: it holds an edge against both the
  cream booth ground and a white browser tab, and it reads on a light or dark
  home screen without a second file. That inversion is why the mark is cream
  here and black in the master — same mark, opposite ground.

  Fine strokes are the cost of this mark: it is crisp from 32px up, and at 16px
  it reads as a dark rounded square rather than as a camera. Not fixable
  without thickening strokes the logo does not have.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="by KAMI">
  <rect width="100" height="100" rx="22" fill="#1a1a1a"/>
  <g fill="#f6efe3">
    <!-- outer frame: uprights, top rail, and the two feet -->
    <rect x="13" y="26.43" width="3.1" height="53.65"/>
    <rect x="83.9" y="26.43" width="3.04" height="53.65"/>
    <rect x="13" y="26.43" width="73.94" height="5.29"/>
    <rect x="13" y="74.91" width="9.78" height="5.16"/>
    <rect x="75.7" y="74.91" width="11.24" height="5.16"/>
    <!-- inner bracket: two rails, ticked at the corners, open down the sides -->
    <rect x="28.61" y="36.45" width="42.35" height="4.01"/>
    <rect x="28.61" y="70.41" width="42.35" height="3.83"/>
    <rect x="28.61" y="36.45" width="1.82" height="9.78"/>
    <rect x="69.08" y="36.45" width="1.88" height="9.78"/>
    <rect x="28.61" y="64.52" width="1.82" height="9.72"/>
    <rect x="69.08" y="64.52" width="1.88" height="9.72"/>
    <!-- shutter button: rounded on top, flat where it faces the frame -->
    <path d="M73.21 25.88V23.27a3.34 3.34 0 0 1 3.34-3.34h6.5a3.34 3.34 0 0 1 3.34 3.34V25.88Z"/>
  </g>
</svg>
